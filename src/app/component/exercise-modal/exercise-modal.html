<!-- Header with Exercise Title -->
<div class="sticky top-0 z-50 bg-gradient-to-r from-blue-50 to-purple-50/95 border-b border-gray-200 px-4 sm:px-6 py-4 mb-4 shadow-sm backdrop-blur-md">
  <div class="flex items-center gap-3">
    <i class="pi pi-lightning text-primary-600 text-2xl"></i>
    <!-- Heading Section -->
    <div>
      <!-- <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Exercise Details</h2> -->
      <h1 class="text-sm sm:text-sm font-semibold text-gray-500">{{ selectedMuscle | titlecase }} Exercises</h1>
    </div>
  </div>
</div>

<!-- Exercise Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 px-4 sm:px-6 pb-6">
  <div *ngFor="let ex of allExercise[selectedMuscle]; let i = index" 
       (click)="navigateToProgress(ex)"
       class="group card-modern exercise-card cursor-pointer animate-slideInUp transition-all duration-300 border border-transparent hover:border-slate-200 hover:shadow-xl"
    >
    <div class="relative overflow-hidden">
      <!-- Background Accent -->
      <div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-br from-blue-100 to-purple-100 rounded-full -mr-10 -mt-10 group-hover:scale-150 transition-transform"></div>
      
      <!-- Content -->
      <div class="relative z-10">
        <div class="flex items-start justify-between mb-4">
          <div>
            <h3 class="text-base sm:text-lg font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
              {{ ex }}
            </h3>
          </div>
          <div class="w-10 h-10 rounded-lg bg-primary-100 flex items-center justify-center group-hover:scale-110 transition-transform">
            <i class="pi pi-arrow-right text-primary-600"></i>
          </div>
        </div>

        <!-- Progress Indicator -->
        <div class="mb-4">
          <p class="text-xs font-semibold text-gray-600 mb-2">View Progress</p>
          <div class="h-2 w-full bg-gray-200 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-primary-600 to-secondary-600 rounded-full" 
                 [style.width.%]="(40 + i * 8)"></div>
          </div>
        </div>

        <!-- Stats Row -->
        <div class="flex gap-3 pt-2 border-t border-gray-100">
          <div class="flex-1 text-center py-2">
            <p class="text-xs text-gray-500 mb-1">Sets</p>
            <p class="text-sm font-bold text-primary-600">3-5</p>
          </div>
          <div class="flex-1 text-center py-2 border-l border-gray-100">
            <p class="text-xs text-gray-500 mb-1">Reps</p>
            <p class="text-sm font-bold text-primary-600">8-12</p>
          </div>
          <div class="flex-1 text-center py-2 border-l border-gray-100">
            <p class="text-xs text-gray-500 mb-1">Intensity</p>
            <span class="badge badge-primary text-xs">High</span>
          </div>
        </div>
      </div>
      
    </div>

    <!-- Hover Action -->
    <div class="mt-4 pt-4 border-t border-black opacity-0 group-hover:opacity-100 transition-opacity">
      <p class="text-xs text-center text-gray-500 group-hover:text-primary-600 font-semibold">
        <i class="pi pi-chevron-right mr-1"></i>
        Click to view progress
      </p>
    </div>
  </div>
</div>
