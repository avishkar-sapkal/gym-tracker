<div class="flex flex-col bg-gradient-to-br from-gray-50 via-blue-50 to-gray-50 ">
    <div class=" animate-slideInUp">
        <!-- Header Card -->
        <div class="card-modern bg-white">
            <h2 class="text-2xl font-semibold text-neutral-900">
                Choose Your Muscle Group
            </h2>
            <!-- Info Card -->
            <p class="text-sm text-gray-700 mt-2">
                 Each muscle group has specific exercises. Choose one to get
                started!
            </p>

            <!-- Muscle Groups Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mt-4">
                <!-- Back -->
                <button (click)="showDialog('back')"
                    class="group card-modern text-left transition-all hover:scale-105 animate-slideInUp"
                    style="animation-delay: 0s;">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3
                                class="text-xl font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
                                Back</h3>
                            <p class="text-xs text-gray-500 mt-1">Lats, Rhomboid, Traps</p>
                        </div>
                        <i
                            class="pi pi-chevron-right text-2xl text-primary-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-red-500 to-pink-500" style="width: 100%;"></div>
                    </div>
                </button>

                <!-- Bicep -->
                <button (click)="showDialog('bicep')"
                    class="group card-modern text-left transition-all hover:scale-105 animate-slideInUp"
                    style="animation-delay: 0.05s;">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3
                                class="text-xl font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
                                Bicep</h3>
                            <p class="text-xs text-gray-500 mt-1">Arms, Forearms</p>
                        </div>
                        <i
                            class="pi pi-chevron-right text-2xl text-primary-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-orange-500 to-yellow-500" style="width: 100%;"></div>
                    </div>
                </button>

                <!-- Chest -->
                <button (click)="showDialog('chest')"
                    class="group card-modern text-left transition-all hover:scale-105 animate-slideInUp"
                    style="animation-delay: 0.1s;">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3
                                class="text-xl font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
                                Chest</h3>
                            <p class="text-xs text-gray-500 mt-1">Pectorals, Stabilizers</p>
                        </div>
                        <i
                            class="pi pi-chevron-right text-2xl text-primary-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-green-500 to-teal-500" style="width: 100%;"></div>
                    </div>
                </button>

                <!-- Tricep -->
                <button (click)="showDialog('tricep')"
                    class="group card-modern text-left transition-all hover:scale-105 animate-slideInUp"
                    style="animation-delay: 0.15s;">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3
                                class="text-xl font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
                                Tricep</h3>
                            <p class="text-xs text-gray-500 mt-1">Arms, Back</p>
                        </div>
                        <i
                            class="pi pi-chevron-right text-2xl text-primary-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500" style="width: 100%;"></div>
                    </div>
                </button>



                <!-- Legs -->
                <button (click)="showDialog('legs')"
                    class="group card-modern text-left transition-all hover:scale-105 animate-slideInUp"
                    style="animation-delay: 0.25s;">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3
                                class="text-xl font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
                                Legs</h3>
                            <p class="text-xs text-gray-500 mt-1">Quads, Hamstrings</p>
                        </div>
                        <i
                            class="pi pi-chevron-right text-2xl text-primary-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-cyan-500 to-blue-500" style="width: 100%;"></div>
                    </div>
                </button>

                <!-- ABS - Full Width -->
                <button (click)="showDialog('abs')"
                    class="group card-modern text-left transition-all hover:scale-105 animate-slideInUp"
                    style="animation-delay: 0.3s;">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3
                                class="text-xl font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
                                Abs</h3>
                            <p class="text-xs text-gray-500 mt-1">Core, Obliques, Rectus</p>
                        </div>
                        <i
                            class="pi pi-chevron-right text-2xl text-primary-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-rose-500 to-red-500" style="width: 100%;"></div>
                    </div>
                </button>

                <!-- Shoulder -->
                <button (click)="showDialog('shoulder')"
                    class="sm:col-span-2  group card-modern text-left transition-all hover:scale-105 animate-slideInUp"
                    style="animation-delay: 0.2s;">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <h3
                                class="text-xl font-bold text-neutral-900 group-hover:text-primary-600 transition-colors">
                                Shoulder</h3>
                            <p class="text-xs text-gray-500 mt-1">Deltoids, Rotators</p>
                        </div>
                        <i
                            class="pi pi-chevron-right text-2xl text-primary-600 group-hover:translate-x-1 transition-transform"></i>
                    </div>
                    <div class="h-1 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-purple-500 to-pink-500" style="width: 100%;"></div>
                    </div>
                </button>
            </div>


        </div>
    </div>
</div>

<!-- Exercise Modal -->
<p-dialog header="Select Exercise" [(visible)]="visible" [modal]="true" [style]="{ width: '90vw', maxWidth: '50rem' }"
    styleClass="custom-dialog">
    <app-exercise-modal *ngIf="selectedMuscle" [allExercise]="exercise" [selectedMuscle]="selectedMuscle"
        [selectedDate]="selectedDate">
    </app-exercise-modal>
</p-dialog>
