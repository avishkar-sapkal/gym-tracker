<header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
        <div class="flex items-center justify-between">
            <!-- Left: App Title & Date -->
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-3 p-3 bg-blue-50 rounded-lg">
                    <i class="pi pi-calendar text-primary-600 text-xl"></i>
                    <div class="flex flex-col">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Today</span>
                        <span class="text-sm font-bold text-gray-700">{{ today | date:'MMM d, yyyy' }}</span>
                    </div>
                </div>
            </div>

            <!-- Center: App Title -->
            <div class="flex-1 text-center">
                <h1 class="text-2xl sm:text-4xl font-bold text-gradient animate-fadeIn">
                    {{ title }}
                </h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-1">Your Fitness Journey Starts Here</p>
            </div>
            <div class="flex flex-col items-end gap-2 sm:gap-3">
                

                <!-- Profile Button & Date -->
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="flex flex-col items-end text-right">
                        <span class="text-xs font-semibold text-blue-800 uppercase tracking-wide">Member Since</span>
                        <span class="text-xs sm:text-sm font-bold text-blue-800">{{ startedDate }}</span>
                    </div>
                    <button (click)="editProfile()" class="flex items-center justify-center w-11 h-11 sm:w-14 sm:h-14 rounded-full
                        bg-gradient-to-br from-blue-400 to-cyan-400
                        hover:from-blue-300 hover:to-cyan-300
                        hover:shadow-xl hover:shadow-blue-500/50 hover:scale-110
                        transition-all duration-300
                        border-2 border-blue-300 cursor-pointer
                        active:scale-95 font-bold text-white text-lg sm:text-xl">
                        <i class="pi pi-user"></i>
                    </button>
                </div>
            </div>
            <!-- Right: User Info & Actions -->
           
        </div>
    </div>
</header>
